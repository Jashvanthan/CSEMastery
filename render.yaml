services:
  - type: web
    name: cse-mastery-hub-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build && npm run seed
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cse-mastery-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: *

databases:
  - name: cse-mastery-db
    plan: free
    databaseName: mastery_hub
    user: mastery_user
